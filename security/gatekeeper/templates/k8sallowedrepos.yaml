apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedrepos
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  crd:
    spec:
      names: { kind: K8sAllowedRepos }
      validation:
        openAPIV3Schema:
          type: object
          properties:
            repos: { type: array, items: { type: string } }
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedrepos
        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          not startswith_any(c.image, input.parameters.repos)
          msg := sprintf("image %v is not from an allowed repository %v", [c.image, input.parameters.repos])
        }
        startswith_any(s, prefixes) { startswith(s, prefixes[_]) }
