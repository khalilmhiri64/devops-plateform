apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: queue }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: queue }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          args: ["--appendonly", "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - { name: data, emptyDir: {} }
