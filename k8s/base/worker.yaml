apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/component: worker }
    spec:
      serviceAccountName: jobs-app
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: localhost:5000/jobs-worker:0.0.0
          envFrom: [{ configMapRef: { name: app-config } }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: jobs-db-credentials, key: database_url } } }
          ports: [{ name: metrics, containerPort: 9100 }]
          readinessProbe: { httpGet: { path: /metrics, port: metrics }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /metrics, port: metrics }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
