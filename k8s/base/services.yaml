apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app.kubernetes.io/name: postgres } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, labels: { app.kubernetes.io/name: redis } }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: v1
kind: Service
metadata: { name: api, labels: { app.kubernetes.io/name: api } }
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, labels: { app.kubernetes.io/name: frontend } }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: worker-metrics, labels: { app.kubernetes.io/name: worker } }
spec:
  selector: { app.kubernetes.io/name: worker }
  ports: [{ name: metrics, port: 9100, targetPort: metrics }]
