# Vault Secrets Operator syncs secret/jobs-platform/database into a Kubernetes
# Secret, so no credentials ever live in Git. Vault is configured by Terraform
# (terraform/modules/vault-config).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: jobs-vault-auth
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: jobs-app-NAMESPACE        # patched per overlay (one Vault role per namespace)
    serviceAccount: jobs-app
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: jobs-db-credentials
spec:
  vaultAuthRef: jobs-vault-auth
  mount: secret
  type: kv-v2
  path: NAMESPACE/jobs-platform/database   # patched per overlay
  refreshAfter: 60s
  destination:
    name: jobs-db-credentials     # keys: username, password, database_url
    create: true
  rolloutRestartTargets:            # restart pods when the password rotates
    - kind: Deployment
      name: worker
