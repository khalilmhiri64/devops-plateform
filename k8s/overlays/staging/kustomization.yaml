apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobs-staging
resources: [../../base]
components: [../../components/deployments]
labels:
  - pairs: { app.kubernetes.io/environment: staging }
    includeSelectors: false
patches:
  - target: { kind: VaultAuth, name: jobs-vault-auth }
    patch: |-
      - { op: replace, path: /spec/kubernetes/role, value: jobs-app-jobs-staging }
  - target: { kind: VaultStaticSecret, name: jobs-db-credentials }
    patch: |-
      - { op: replace, path: /spec/path, value: jobs-staging/jobs-platform/database }
      - { op: add, path: /spec/rolloutRestartTargets/-, value: { kind: Deployment, name: api } }
  - target: { kind: Ingress, name: jobs }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: staging.jobs.localtest.me }
  - target: { kind: ConfigMap, name: app-config }
    patch: |-
      - { op: replace, path: /data/LOG_LEVEL, value: DEBUG }
  - target: { kind: Deployment, name: worker }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
# Bumped by scripts/gitops-bump.sh from the Jenkins pipeline.
images:
  - name: localhost:5000/jobs-api
    newTag: 0.1.0
  - name: localhost:5000/jobs-worker
    newTag: 0.1.0
  - name: localhost:5000/jobs-frontend
    newTag: 0.1.0
