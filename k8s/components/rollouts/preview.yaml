apiVersion: v1
kind: Service
metadata: { name: frontend-preview, labels: { app.kubernetes.io/name: frontend } }
spec:
  selector: { app.kubernetes.io/name: frontend }   # Argo Rollouts adds the pod-template-hash selector
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: jobs-preview }
spec:
  ingressClassName: nginx
  rules:
    - host: preview.jobs.localtest.me
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: frontend-preview, port: { name: http } } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-preview-smoke }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: frontend } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchExpressions: [{ key: job-name, operator: Exists }] } }]
      ports: [{ port: 8080 }]
