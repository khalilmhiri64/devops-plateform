# BLUE-GREEN: the new version (green) comes up behind the "frontend-preview"
# service. Users keep hitting the active (blue) version until promotion, which is
# manual (kubectl argo rollouts promote frontend) after the preview smoke test.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/component: frontend }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector: { matchLabels: { app.kubernetes.io/name: frontend } }
  strategy:
    blueGreen:
      activeService: frontend
      previewService: frontend-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 120          # keep blue around for instant rollback
      prePromotionAnalysis:
        templates: [{ templateName: frontend-smoke }]
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/component: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: localhost:5000/jobs-frontend:0.0.0
          env:
            - { name: API_UPSTREAM, value: "http://api:8000" }
            - { name: DNS_RESOLVER, value: "kube-dns.kube-system.svc.cluster.local" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: conf, emptyDir: {} }
