jenkins:
  systemMessage: "Jobs Platform CI. Configured by JCasC, do not edit in the UI."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy: loggedInUsersCanDoAnything
unclassified:
  location:
    url: http://localhost:8081/
jobs:
  - script: |
      multibranchPipelineJob('jobs-platform') {
        branchSources {
          git {
            id('jobs-platform')
            remote('${REPO_URL:-https://github.com/your-org/devops-platform.git}')
          }
        }
        factory { workflowBranchProjectFactory { scriptPath('Jenkinsfile') } }
        orphanedItemStrategy { discardOldItems { numToKeep(10) } }
        triggers { periodicFolderTrigger { interval('5m') } }
      }
