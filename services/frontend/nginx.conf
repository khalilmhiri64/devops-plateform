# Runs as non-root (nginx-unprivileged listens on 8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Same-origin proxy to the API avoids CORS in every environment.
    location ~ ^/(api|version)(/|$) {
        set $upstream ${API_UPSTREAM};
        resolver ${DNS_RESOLVER} valid=10s;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
    }

    location / { try_files $uri $uri/ /index.html; }
}
