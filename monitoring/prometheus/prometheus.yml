global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { environment: local }

rule_files: [alerts.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: jobs-api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"], labels: { service: jobs-api } }]

  - job_name: jobs-worker
    dns_sd_configs:            # discovers every worker replica
      - names: [worker]
        type: A
        port: 9100
    relabel_configs:
      - target_label: service
        replacement: jobs-worker
