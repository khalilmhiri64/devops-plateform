server: { http_listen_port: 9080, grpc_listen_port: 0 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: "http://loki:3100/loki/api/v1/push" }]

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters: [{ name: label, values: ["com.docker.compose.project=jobs"] }]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # API and worker log JSON; lift level/service into labels, keep job_id as metadata.
      - json:
          expressions: { level: level, service: service, job_id: job_id }
      - labels: { level: "", service: "" }
      - structured_metadata: { job_id: "" }
